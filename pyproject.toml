[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shinobi"
version = "0.1.0"
description = "🥷 Shinobi — deploy, execute, vanish. Zero-footprint coding agent swarm protocol."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
shinobi-pack = "packager.cli:main"
shinobi-process = "processor.cli:main"
shinobi = "shinobi_agent:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packager", "spawner", "vanish", "processor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
